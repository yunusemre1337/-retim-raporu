<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Günlük Üretim Raporu</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mut:#667085;--bd:#e3e6ec;--ac:#1d5fd1;--act:#fff;--warn:#fff4e5;--warnt:#9a4b00;--ok:#e8f6ee;--okt:#17653a}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#12151b;--card:#1b2029;--tx:#eceff4;--mut:#9aa4b5;--bd:#2c3340;--ac:#5b93f0;--act:#0d1a33;--warn:#3a2a12;--warnt:#ffc27a;--ok:#14301f;--okt:#7fdca4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{padding:13px;border:0;border-radius:10px;background:var(--ac);color:var(--act);font:inherit;font-weight:700;width:100%;cursor:pointer;margin-top:14px}
.ghost{background:transparent;color:var(--ac);border:1px dashed var(--ac);margin-top:8px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:flex-end}
.row .q{width:100px;flex:none}
.x{width:42px;flex:none;padding:11px;border:1px solid var(--bd);background:transparent;color:var(--mut);border-radius:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.stat{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
.stat b{display:block;font-size:22px}
.stat span,.mut{font-size:13px;color:var(--mut)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.ok{background:var(--ok);color:var(--okt)}.no{background:var(--warn);color:var(--warnt)}
.item{padding:10px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.sorun{background:var(--warn);color:var(--warnt);padding:8px 10px;border-radius:8px;margin-top:6px;font-size:14px}
.msg{padding:10px;border-radius:8px;margin:10px 0;display:none}
.top{display:flex;justify-content:space-between;align-items:center}
.top button{background:none;border:0;color:var(--mut);font-size:13px;cursor:pointer;text-decoration:underline}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<section id="login" hidden>
  <h1>Günlük Üretim Raporu</h1>
  <div class="card">
    <label>Kullanıcı adı (patron: e-posta)</label>
    <input id="lu" autocomplete="username" autocapitalize="none">
    <label>Şifre</label>
    <input id="lp" type="password" autocomplete="current-password">
    <div class="msg no" id="lm"></div>
    <button class="btn" id="lb" type="button">Giriş yap</button>
  </div>
</section>

<section id="app" hidden>
  <div class="top"><h1 id="hi"></h1><button id="out" type="button">Çıkış</button></div>

  <div id="worker" hidden>
    <div class="msg ok" id="wm">Raporun patrona iletildi. Eline sağlık!</div>
    <div class="card">
      <label>Bölüm</label><select id="bol"></select>
      <label style="margin-top:16px">Bugün yaptığın işler</label>
      <div id="rows"></div>
      <button class="btn ghost" id="add" type="button">+ Ürün ekle</button>
      <label>Sorun / not (varsa)</label>
      <textarea id="not" rows="2" placeholder="Makine arızası, malzeme eksikliği, fire..."></textarea>
      <button class="btn" id="send" type="button">Raporu Gönder</button>
    </div>
    <div class="card"><b>Bugün gönderdiklerim</b><div id="mine" style="margin-top:6px"></div></div>
  </div>

  <div id="boss" hidden>
    <div class="tabs"><button id="b1" class="on" type="button">Raporlar</button><button id="b2" type="button">Çalışanlar</button></div>
    <div id="pr">
      <div class="card">
        <label style="margin-top:0">Tarih seç</label><input type="date" id="gun">
        <div class="mut" id="tarih" style="margin-top:8px"></div>
        <div class="grid" id="ozet"></div>
      </div>
      <div class="card"><b>Rapor girmeyenler</b><div id="eksik" style="margin-top:6px"></div></div>
      <div class="card"><b>Raporlar</b><div id="liste" style="margin-top:6px"></div></div>
    </div>
    <div id="pc" hidden>
      <div class="card">
        <b>Yeni çalışan ekle</b>
        <label>Ad Soyad</label><input id="wn">
        <label>Kullanıcı adı (boşluksuz, küçük harf)</label><input id="wu" autocapitalize="none">
        <label>Şifre (en az 6 karakter)</label><input id="wp">
        <label>Bölüm</label><select id="wb"></select>
        <div class="msg" id="wmm"></div>
        <button class="btn" id="wadd" type="button">Çalışanı ekle</button>
      </div>
      <div class="card"><b>Çalışanlar</b><div id="wl" style="margin-top:6px"></div></div>
    </div>
  </div>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var cfg={apiKey:"AIzaSyAfD5163ZOxrkYpO1HnvMlnqBgoU5LTq_o",authDomain:"uretim-raporu.firebaseapp.com",projectId:"uretim-raporu",storageBucket:"uretim-raporu.firebasestorage.app",messagingSenderId:"721598486237",appId:"1:721598486237:web:431fcdc36eacbe1d40ed34"};
var BOSS="emre_tsknt@hotmail.com",DOM="@uretim-raporu.app";
var BOL=["Eko","Plise","Montaj","Paketleme","Panel","Polen Filtresi"];
firebase.initializeApp(cfg);
var auth=firebase.auth(),db=firebase.firestore(),me=null;
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")}
function flash(id,txt,cls,ms){var m=$(id);m.textContent=txt;m.className="msg "+cls;m.style.display="block";if(ms)setTimeout(function(){m.style.display="none"},ms)}
["bol","wb"].forEach(function(id){BOL.forEach(function(b){var o=document.createElement("option");o.textContent=b;$(id).appendChild(o)})});

$("lb").onclick=function(){
  var u=$("lu").value.trim();if(!u)return;
  if(u.indexOf("@")<0)u=u.toLowerCase()+DOM;
  auth.signInWithEmailAndPassword(u,$("lp").value).catch(function(){flash("lm","Giriş başarısız: kullanıcı adı veya şifre hatalı.","no")});
};
$("out").onclick=function(){auth.signOut()};

auth.onAuthStateChanged(function(user){
  if(!user){me=null;$("app").hidden=true;$("login").hidden=false;return}
  if((user.email||"").toLowerCase()===BOSS){me={uid:user.uid,boss:true,name:"Patron"};start();return}
  db.collection("users").doc(user.uid).get().then(function(s){
    if(!s.exists){alert("Bu hesap yetkili değil. Patronla görüşün.");auth.signOut();return}
    me=Object.assign({uid:user.uid,boss:false},s.data());start();
  }).catch(function(){alert("Bağlantı hatası. Tekrar deneyin.")});
});

function start(){
  $("login").hidden=true;$("app").hidden=false;
  $("hi").textContent=me.boss?"Patron paneli":"Merhaba, "+me.name;
  $("worker").hidden=me.boss;$("boss").hidden=!me.boss;
  if(me.boss){$("gun").value=today();loadBoss();loadWorkers()}
  else{if(me.dept)$("bol").value=me.dept;if(!$("rows").children.length)addRow();loadMine()}
}

function addRow(){
  var r=document.createElement("div");r.className="row";
  r.innerHTML='<div style="flex:1"><label>Ürün</label><input class="u" placeholder="Örn. Kabin filtresi"></div><div class="q"><label>Adet</label><input class="a" type="number" inputmode="numeric" min="0" placeholder="0"></div><button class="x" type="button">✕</button>';
  r.querySelector(".x").onclick=function(){if($("rows").children.length>1)r.remove()};
  $("rows").appendChild(r);
}
$("add").onclick=addRow;

$("send").onclick=function(){
  var it=[];
  document.querySelectorAll("#rows .row").forEach(function(r){
    var u=r.querySelector(".u").value.trim(),a=parseInt(r.querySelector(".a").value,10);
    if(u&&a>0)it.push({u:u,a:a});
  });
  if(!it.length){alert("En az bir ürün ve adet gir.");return}
  $("send").disabled=true;
  db.collection("reports").add({uid:me.uid,name:me.name,dept:$("bol").value,date:today(),items:it,note:$("not").value.trim(),createdAt:firebase.firestore.FieldValue.serverTimestamp()})
  .then(function(){
    $("rows").innerHTML="";addRow();$("not").value="";
    flash("wm","Raporun patrona iletildi. Eline sağlık!","ok",4000);loadMine();
  }).catch(function(){alert("Gönderilemedi. İnterneti kontrol edip tekrar dene.")})
  .then(function(){$("send").disabled=false});
};

function itemsHtml(x){return x.items.map(function(i){return esc(i.u)+': <b>'+i.a+'</b>'}).join(" · ")}
function loadMine(){
  db.collection("reports").where("uid","==",me.uid).where("date","==",today()).get().then(function(q){
    var h=q.docs.map(function(d){var x=d.data();return '<div class="item"><span class="mut">'+esc(x.dept)+'</span><div>'+itemsHtml(x)+'</div>'+(x.note?'<div class="sorun">⚠ '+esc(x.note)+'</div>':'')+'</div>'}).join("");
    $("mine").innerHTML=h||'<span class="mut">Henüz rapor göndermedin.</span>';
  });
}

var staff=[];
function loadWorkers(){
  return db.collection("users").get().then(function(q){
    staff=q.docs.map(function(d){return Object.assign({uid:d.id},d.data())});
    $("wl").innerHTML=staff.map(function(s){return '<div class="item"><b>'+esc(s.name)+'</b> <span class="mut">· '+esc(s.dept)+' · '+esc(s.username)+'</span></div>'}).join("")||'<span class="mut">Henüz çalışan yok.</span>';
    loadBoss();
  });
}
function loadBoss(){
  var g=$("gun").value||today();
  db.collection("reports").where("date","==",g).get().then(function(q){
    var d=q.docs.map(function(x){return x.data()});
    $("tarih").textContent=new Date(g+"T12:00:00").toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+" · "+d.length+" rapor";
    var tot={};BOL.forEach(function(b){tot[b]=0});
    d.forEach(function(x){x.items.forEach(function(i){tot[x.dept]=(tot[x.dept]||0)+i.a})});
    $("ozet").innerHTML=BOL.map(function(b){return '<div class="stat"><b>'+tot[b]+'</b><span>'+b+' · adet</span></div>'}).join("");
    var gir={};d.forEach(function(x){gir[x.uid]=1});
    var ek=staff.filter(function(s){return !gir[s.uid]});
    $("eksik").innerHTML=!staff.length?'<span class="mut">Önce Çalışanlar sekmesinden çalışan ekle.</span>':ek.length?ek.map(function(s){return '<span class="pill no">'+esc(s.name)+'</span>'}).join(""):'<span class="pill ok">Herkes rapor girdi</span>';
    d.sort(function(a,b){return (b.note?1:0)-(a.note?1:0)});
    $("liste").innerHTML=d.map(function(x){return '<div class="item"><b>'+esc(x.name)+'</b> <span class="mut">· '+esc(x.dept)+'</span><div>'+itemsHtml(x)+'</div>'+(x.note?'<div class="sorun">⚠ '+esc(x.note)+'</div>':'')+'</div>'}).join("")||'<span class="mut">Bu tarihte rapor yok.</span>';
  }).catch(function(){$("liste").textContent="Raporlar okunamadı."});
}
$("gun").onchange=loadBoss;
function tab(n){$("pr").hidden=n!==1;$("pc").hidden=n!==2;$("b1").className=n===1?"on":"";$("b2").className=n===2?"on":""}
$("b1").onclick=function(){tab(1)};$("b2").onclick=function(){tab(2)};

$("wadd").onclick=function(){
  var n=$("wn").value.trim(),u=$("wu").value.trim().toLowerCase(),p=$("wp").value;
  if(!n||!/^[a-z0-9._-]+$/.test(u)||p.length<6){flash("wmm","Ad, kullanıcı adı (harf/rakam) ve en az 6 karakterli şifre gerekli.","no");return}
  var sec=firebase.apps.filter(function(a){return a.name==="sec"})[0]||firebase.initializeApp(cfg,"sec");
  $("wadd").disabled=true;
  sec.auth().createUserWithEmailAndPassword(u+DOM,p).then(function(c){
    var id=c.user.uid;
    return sec.auth().signOut().then(function(){
      return db.collection("users").doc(id).set({name:n,username:u,dept:$("wb").value,role:"worker"});
    });
  }).then(function(){
    $("wn").value=$("wu").value=$("wp").value="";
    flash("wmm","Çalışan eklendi. Kullanıcı adı ve şifreyi ona ilet.","ok",5000);loadWorkers();
  }).catch(function(e){flash("wmm",e&&e.code==="auth/email-already-in-use"?"Bu kullanıcı adı zaten var.":"Eklenemedi, tekrar dene.","no")})
  .then(function(){$("wadd").disabled=false});
};
</script>
</body>
</html>
